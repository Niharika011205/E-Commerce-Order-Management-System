name: Backend CI / build-and-test (Inventory-Service/Inventory-Service)

on:
  push:
    branches: [ main ]
    paths:
      - 'Inventory-Service/**'
      - '.github/workflows/inventory-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Inventory-Service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build with Maven
      run: cd Inventory-Service/Inventory-Service && mvn clean package -DskipTests

    - name: Run tests
      run: cd Inventory-Service/Inventory-Service && mvn test
