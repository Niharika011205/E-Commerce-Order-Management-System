name: Backend CI / build-and-test (Order-Service/Order-Service)

on:
  push:
    branches: [ main ]
    paths:
      - 'Order-Service/**'
      - '.github/workflows/order-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Order-Service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build with Maven
      run: cd Order-Service/Order-Service && mvn clean package -DskipTests

    - name: Run tests
      run: cd Order-Service/Order-Service && mvn test
