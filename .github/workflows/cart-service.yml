name: Backend CI / build-and-test (Cart-Service/Cart-Service)

on:
  push:
    branches: [ main ]
    paths:
      - 'Cart-Service/**'
      - '.github/workflows/cart-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Cart-Service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build with Maven
      run: cd Cart-Service/Cart-Service && mvn clean package -DskipTests

    - name: Run tests
      run: cd Cart-Service/Cart-Service && mvn test
