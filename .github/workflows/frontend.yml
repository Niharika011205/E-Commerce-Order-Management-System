name: Frontend CI / build-and-test (Frontend/AI-Ecommerce-Platform)

on:
  push:
    branches: [ main ]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: cd Frontend/AI-Ecommerce-Platform && npm install

    - name: Run linter
      run: cd Frontend/AI-Ecommerce-Platform && npm run lint
      continue-on-error: true

    - name: Run tests
      run: cd Frontend/AI-Ecommerce-Platform && npm test
      continue-on-error: true

    - name: Build application
      run: cd Frontend/AI-Ecommerce-Platform && npm run build
