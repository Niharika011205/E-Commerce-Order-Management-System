name: Backend CI / build-and-test (Service-Registry/Service-Registry)

on:
  push:
    branches: [ main ]
    paths:
      - 'Service-Registry/**'
      - '.github/workflows/service-registry.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Service-Registry/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build with Maven
      run: cd Service-Registry/Service-Registry && mvn clean package -DskipTests

    - name: Run tests
      run: cd Service-Registry/Service-Registry && mvn test
