name: Frontend CI

on:
  push:
    paths:
      - 'Frontend/AI-Ecommerce-Platform/**'
  pull_request:
    paths:
      - 'Frontend/AI-Ecommerce-Platform/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Frontend/AI-Ecommerce-Platform

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './Frontend/AI-Ecommerce-Platform/package-lock.json'
        
    - name: Install Dependencies
      run: npm ci || npm install
      
    - name: Run Tests
      run: npm run test
